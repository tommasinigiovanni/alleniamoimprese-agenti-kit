name: Prove del kit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -x -s bash install.sh bin/* test/*.sh
      - name: Rilascio riproducibile e sotto i 32 KiB
        run: |
          python3 tools/crea-rilascio.py v0.0-prova
          uno=$(cut -d' ' -f1 dist/alleniamoimprese-agenti-kit-v0.0-prova.tar.gz.sha256)
          python3 tools/crea-rilascio.py v0.0-prova
          due=$(cut -d' ' -f1 dist/alleniamoimprese-agenti-kit-v0.0-prova.tar.gz.sha256)
          test "$uno" = "$due"
          wc -c dist/cloud-init-v0.0-prova.yaml
      - name: Schema di cloud-init
        run: |
          sudo apt-get install -y -q cloud-init > /dev/null
          cloud-init schema --config-file dist/cloud-init-v0.0-prova.yaml
      - name: qr-login-claude e qr-login-codex
        run: |
          sudo apt-get install -y -q tmux qrencode jq > /dev/null
          bash test/prova-qr-login.sh
          bash test/prova-qr-login-codex.sh
      - name: salute, le righe del login
        run: bash test/prova-salute-login.sh

  # Ubuntu 24.04 e 26.04, in un contenitore senza systemd: la 26.04 ha
  # sudo-rs e Python 3.14, e il kit deve reggere su tutte e due.
  contenitore:
    strategy:
      fail-fast: false
      matrix:
        immagine: ["ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installazione due volte e verifica, su ${{ matrix.immagine }}
        run: bash test/prova-docker.sh "" "${{ matrix.immagine }}"

  installazione:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Copia del kit come lo trova la macchina
        run: |
          sudo mkdir -p /opt/agenti-kit
          sudo cp -r install.sh bin boss console macchina test /opt/agenti-kit/
          echo v-prova | sudo tee /opt/agenti-kit/VERSIONE
      - name: Prima installazione
        run: sudo bash /opt/agenti-kit/install.sh
      - name: Seconda installazione, deve reggere
        run: sudo bash /opt/agenti-kit/install.sh
      - name: Stato dei passi
        run: sudo cat /var/lib/agenti-kit/stato
      - name: Verifica
        run: sudo bash /opt/agenti-kit/test/verifica-installazione.sh
      - name: Una sessione aperta a mano resta accesa
        if: always()
        run: |
          sudo -u agente -H tmux new-session -d -s boss -x 110 -y 30 -c /home/agente/boss 'claude -n boss --rc'
          sleep 15
          sudo -u agente -H tmux has-session -t boss
          sudo -u agente -H tmux capture-pane -p -t boss | tail -n 20
          # Il nome della sessione si deve vedere sullo schermo di Claude.
          sudo -u agente -H tmux capture-pane -p -t boss | grep -q ' boss '
          sudo -u agente -H tmux capture-pane -p -t boss | grep -q '~/boss'
      - name: SSH sulla 2222, con la password, solo agente
        if: always()
        run: |
          systemctl is-active ssh.socket
          sudo ss -H -ltn | awk '{print $4}' | grep -E ':2222$'
          ! sudo ss -H -ltn | awk '{print $4}' | grep -E ':22$'
          sudo sshd -T | grep -x 'port 2222'
          sudo sshd -T | grep -x 'passwordauthentication yes'
          sudo sshd -T | grep -x 'permitemptypasswords no'
          sudo sshd -T | grep -x 'kbdinteractiveauthentication no'
          sudo sshd -T | grep -x 'permitrootlogin no'
          sudo sshd -T | grep -x 'allowusers agente'
      - name: Il gesto dello studente, entrare con la password
        if: always()
        run: |
          sudo apt-get install -y -q sshpass > /dev/null
          # Con una password sbagliata non entra nessuno.
          ! sshpass -p qualsiasi ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=5 agente@127.0.0.1 true
          # Con la password che il kit ha dato ad agente, quella del promemoria, sì.
          sshpass -p "$(sudo cat /home/agente/.password-iniziale)" ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=5 agente@127.0.0.1 'whoami' | grep -x agente
          # Lo studente può cambiarla; qui la cambia root, per le prove dopo.
          echo 'agente:prova-corso-2026' | sudo chpasswd
          sshpass -p prova-corso-2026 ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=5 agente@127.0.0.1 'whoami; ls -ld segreti'
          # Root non entra, neanche con la password giusta.
          echo 'root:prova-corso-2026' | sudo chpasswd
          ! sshpass -p prova-corso-2026 ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@127.0.0.1 true
          # Sulla 22 non risponde nessuno.
          ! ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes agente@127.0.0.1 true 2>/dev/null
          # Un install.sh rilanciato non toglie la password.
          sudo bash /opt/agenti-kit/install.sh > /dev/null
          sshpass -p prova-corso-2026 ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=5 agente@127.0.0.1 true
      - name: "sudo: agente con la password sì, senza password no"
        if: always()
        run: |
          # Da SSH, come lo studente: la password di agente apre sudo.
          sshpass -p prova-corso-2026 ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=5 agente@127.0.0.1 'echo prova-corso-2026 | sudo -S -p "" whoami' | grep -x root
          # Senza terminale e senza password, come Claude: no.
          ! sshpass -p prova-corso-2026 ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=5 agente@127.0.0.1 'sudo -n whoami'
          # Il permesso dato in una sessione non passa a un'altra shell.
          ! sshpass -p prova-corso-2026 ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=5 agente@127.0.0.1 'sudo -n whoami'
      - name: Syncthing si accende come servizio di agente e collega una cartella
        if: always()
        run: |
          uid="$(id -u agente)"
          come() { sudo -u agente -H env XDG_RUNTIME_DIR="/run/user/$uid" "$@"; }
          prima="$(come syncthing --device-id)"
          come systemctl --user enable --now syncthing.service
          sleep 8
          come systemctl --user is-active syncthing.service
          come syncthing cli config folders add --id prova --label prova --path /home/agente/progetti/prova
          come syncthing cli config folders list | grep -x prova
          test "$prima" = "$(come syncthing --device-id)"
          ss -ltn | grep -q '127.0.0.1:8384'
          sudo -u agente -H bash -lc 'salute' | grep 'Syncthing acceso. Cartelle collegate: prova'
          # Le porte di Syncthing non devono comparire fra quelle aperte. Le
          # altre porte della macchina di prova qui non contano.
          sudo -u agente -H bash -lc 'salute' | grep -E 'porta|Porte' || true
          ! sudo -u agente -H bash -lc 'salute' | grep -E 'Porte in ascolto.*:(22000|21027)( |$)'
          udp="$(sudo ss -H -lunp | grep -c syncthing || true)"
          echo "porte UDP di Syncthing: $udp"
          test "$udp" -ge 2
      - name: salute come agente, senza login
        if: always()
        run: sudo -u agente -H bash -lc 'salute' || true
      - name: Registro dell'installazione
        if: always()
        run: sudo tail -n 120 /var/log/agenti-kit-install.log || true
