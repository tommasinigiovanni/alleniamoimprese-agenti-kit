name: Diagnosi del login

# Mostra come la sessione di Claude disegna l'indirizzo di /login, e cosa ne
# ricava qr-login. Non completa nessun login.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installazione
        run: |
          sudo mkdir -p /opt/agenti-kit
          sudo cp -r install.sh bin systemd console test /opt/agenti-kit/
          echo v-prova | sudo tee /opt/agenti-kit/VERSIONE
          sudo bash /opt/agenti-kit/install.sh > /dev/null
      - name: /login nella sessione, schermo per schermo
        run: |
          sleep 15
          a() { sudo -u agente -H "$@"; }
          for larghezza in 80 128; do
            echo "################ finestra da $larghezza colonne"
            a systemctl --user --machine=agente@ restart claude-sessione.service 2>/dev/null ||
              sudo systemctl --user --machine=agente@ restart claude-sessione.service
            sleep 12
            a tmux -L agenti resize-window -t claude -x "$larghezza" -y 40 || true
            sleep 2
            echo "=== qr-login dal menu: chiede il login da solo"
            a bash -lc qr-login > /tmp/qr.txt 2>&1 || true
            head -n 3 /tmp/qr.txt
            indirizzo="$(grep -m1 '^https://' /tmp/qr.txt)"
            echo "$indirizzo"
            echo "lunghezza: ${#indirizzo}"
            case "$indirizzo" in
              https://*state=*) echo "passa: l'indirizzo arriva fino a state=" ;;
              *) echo "FALLISCE: indirizzo incompleto"; exit 1 ;;
            esac
          done
