#cloud-config
# Profilo 24ORE: chiave SSH, porta 2222 e dashboard.
# Kit del corso "Agenti che non dormono", versione v1.7-24ore.
# Scarica il kit, ne controlla l'impronta e lo installa.
# Se l'impronta non torna, si ferma e non installa niente.
disable_root: false
ssh_pwauth: false
packages: [curl, ca-certificates]
runcmd:
  - [bash, -c, 'set -euo pipefail; cd /root; curl -fsSL --retry 10 --retry-all-errors --retry-delay 10 --max-time 180 -o kit.tar.gz https://github.com/tommasinigiovanni/alleniamoimprese-agenti-kit/releases/download/v1.7-24ore/alleniamoimprese-agenti-kit-v1.7-24ore.tar.gz; echo "f0c2e9fba5ecd2009201e947d39fabdb5585041f60e5b5f78e4118e4062339d7  kit.tar.gz" | sha256sum -c -; rm -rf /opt/agenti-kit; tar -xzf kit.tar.gz -C /opt --no-same-owner; AGENTI_PROFILO=24ore bash /opt/agenti-kit/install.sh']
